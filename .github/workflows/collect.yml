name: Collect Taiwan ER data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: taiwan-er-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser-grade HTTP client
        run: python -m pip install "curl-cffi>=0.13,<1"

      - name: Fetch and validate official hospital data
        run: python collector.py
        env:
          APPS_SCRIPT_INGEST_URL: ${{ secrets.APPS_SCRIPT_INGEST_URL }}
          APPS_SCRIPT_INGEST_TOKEN: ${{ secrets.APPS_SCRIPT_INGEST_TOKEN }}

