name: Collect Taiwan ER data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: taiwan-er-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate official hospital data
        run: node collector.mjs
        env:
          APPS_SCRIPT_INGEST_URL: ${{ secrets.APPS_SCRIPT_INGEST_URL }}
          APPS_SCRIPT_INGEST_TOKEN: ${{ secrets.APPS_SCRIPT_INGEST_TOKEN }}

