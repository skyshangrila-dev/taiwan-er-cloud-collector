name: Audit Taiwan ER source access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiwan-er-cloud-collector
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser-grade HTTP client
        run: python -m pip install "curl-cffi>=0.13,<1"

      - name: Probe official hospital source pages
        run: python probe_sources.py

