name: Audit Taiwan ER source access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiwan-er-cloud-collector
  cancel-in-progress: false

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Query NHI through a real browser
        run: node browser_probe.mjs
